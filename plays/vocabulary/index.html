<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocabulary · akiyolab</title>
<link rel="stylesheet" href="../../design/tokens.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
<style>
  main { max-width: var(--content-narrow); margin: auto; padding: var(--sp-6) var(--sp-4) var(--sp-8); }
  .back, .muted { color: var(--c-text-muted); font-size: var(--fs-sm); }
  .back:hover, .login { text-decoration: underline; }
  header { margin: var(--sp-7) 0 var(--sp-5); }
  h1 { margin: 0; font: var(--fw-normal) var(--fs-2xl)/var(--lh-tight) var(--font-serif); }
  h2 { margin: 0; font: var(--fw-normal) var(--fs-lg)/var(--lh-tight) var(--font-serif); }
  p { margin: 0; }
  header p { margin-top: var(--sp-2); }
  form, #randomSection, .gate {
    padding: var(--sp-4);
    background: var(--c-surface);
    border: 1px solid var(--c-line);
    border-radius: var(--radius-lg);
  }
  label { font-size: var(--fs-sm); }
  input, select, button {
    min-height: var(--sp-7);
    padding: var(--sp-2) var(--sp-3);
    border: 1px solid var(--c-line-strong);
    border-radius: var(--radius-md);
    background: var(--c-surface);
    color: var(--c-text);
    font: inherit;
  }
  :focus-visible { outline: 2px solid var(--c-accent); outline-offset: 2px; }
  input { width: 100%; min-width: 0; }
  .entry-line { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--sp-2); margin-top: var(--sp-1); }
  .primary { background: var(--c-accent); border-color: var(--c-accent); color: var(--c-surface); }
  .primary:hover:not(:disabled) { background: var(--c-accent-hover); }
  button:disabled, select:disabled { opacity: 0.55; cursor: default; }
  .status { margin-top: var(--sp-2); min-height: var(--sp-5); }
  [data-error] { color: var(--c-negative); }
  #retry { margin-top: var(--sp-3); }
  #randomSection, .collection { margin-top: var(--sp-5); }
  .toolbar, .filters { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2) var(--sp-3); }
  .toolbar { justify-content: space-between; }
  .filters { margin: var(--sp-3) 0; }
  .filters label:not([hidden]) { display: grid; min-width: 0; gap: var(--sp-1); }
  select { max-width: 100%; font-size: var(--fs-sm); }
  .list, .cards { list-style: none; margin: 0; padding: 0; }
  .list { border-top: 1px solid var(--c-line); }
  .list li { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--sp-3); padding: var(--sp-3) 0; border-bottom: 1px solid var(--c-line); }
  .term { font-family: var(--font-serif); font-size: var(--fs-lg); overflow-wrap: anywhere; }
  .count { flex: none; font-variant-numeric: tabular-nums; }
  .tags { margin-top: var(--sp-1); overflow-wrap: anywhere; }
  .cards { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: var(--sp-2); }
  .cards li { display: grid; align-content: center; min-height: var(--sp-9); padding: var(--sp-3); border: 1px solid var(--c-line); border-radius: var(--radius-md); background: var(--c-surface-alt); text-align: center; animation: reveal var(--dur-slow) var(--ease-out) both; }
  #randomTitle { margin-bottom: var(--sp-3); }
  @keyframes reveal { from { opacity: 0; transform: rotateY(-75deg); } }
</style>
</head>
<body>
<main>
  <a class="back" href="../../">← 首页</a>
  <header>
    <h1>Vocabulary</h1>
    <p class="muted">随手收下想到的词，偶尔翻出来看看。</p>
  </header>

  <div id="gate" class="gate">
    <p id="gateStatus" role="status">正在检查登录状态…</p>
    <a id="login" class="login" href="../../auth/" hidden>Owner 登录</a>
  </div>

  <div id="box" hidden>
    <form id="appendForm">
      <label for="word">想收下的词或短语</label>
      <div class="entry-line">
        <input id="word" name="word" type="text" dir="auto" autocomplete="off" maxlength="120" required>
        <button class="primary" id="append" type="submit" disabled>追加</button>
      </div>
      <p id="status" class="status muted" role="status"></p>
      <button type="button" id="retry" hidden>重新加载</button>
    </form>

    <section class="collection" aria-labelledby="collectionTitle">
      <div class="toolbar">
        <h2 id="collectionTitle">盒子里的词</h2>
        <button type="button" id="random" disabled>随机抽 3 个</button>
      </div>
      <section id="randomSection" aria-labelledby="randomTitle" hidden>
        <h2 id="randomTitle">这次翻到</h2>
        <ul id="randomWords" class="cards" aria-live="polite"></ul>
      </section>

      <div class="filters">
        <label>排序
          <select id="sort">
            <option value="recent">最近追加</option>
            <option value="frequency">出现最多</option>
          </select>
        </label>
        <label id="tagFilter" hidden>标签
          <select id="filter"><option value="">全部标签</option></select>
        </label>
      </div>
      <p id="summary" class="muted" role="status"></p>
      <ul id="wordList" class="list" aria-label="词条"></ul>
    </section>
  </div>
</main>
<script type="module" src="./vocabulary.js"></script>
</body>
</html>
